<footer class="footer">
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 20px;">
      <div class="logo">
        <div class="logo-badge">PK</div>
        <span>PRATIK<span class="gradient-text">.AI</span></span>
      </div>

      <div style="display: flex; gap: 16px;">
        {% for link in social_links %}
          <a href="{{ link.url }}" target="_blank" rel="noopener" style="color: var(--text-muted); font-size: 1.2rem;" title="{{ link.platform }}">
            <i data-lucide="{{ link.icon|default:'link' }}"></i>
          </a>
        {% endfor %}
      </div>
    </div>

    <p style="color: var(--text-muted); font-size: 0.85rem;">
      {{ site_settings.copyright_text|default:"© 2026 Pratik Kautik Pawar. All rights reserved." }}
    </p>
  </div>
</footer>
